name: gamepads_windows
description: Windows implementation of gamepads, a Flutter plugin to handle gamepad input across multiple platforms.
version: 0.3.2
publish_to: none
homepage: https://github.com/flame-engine/gamepads
repository: https://github.com/flame-engine/gamepads/tree/main/packages/gamepads_windows

# Vendored from pub.dev gamepads_windows 0.3.2 (rumble, connection events,
# vendorId/productId). BikeControl changes:
# - Uses the GameInput v2 API (Microsoft.GameInput 4.0.300 NuGet, in
#   windows/gameinput/) with background input enabled, so gamepads keep
#   working while another app (Zwift, MyWhoosh, ...) has focus. The Windows
#   SDK v0 API only delivers input to the foreground app.
# - Thread safety: the device list is locked, reader threads are joined
#   before their pad is freed and on shutdown, and every channel call is
#   marshalled to the platform thread.

flutter:
  plugin:
    implements: gamepads
    platforms:
      windows:
        pluginClass: GamepadsWindowsPluginCApi

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  gamepads_platform_interface: ^0.1.4
